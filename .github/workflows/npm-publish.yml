name: Publish NPM package

on:
  push:
    branches:
      - master
  pull_request:

jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Test
          run: npm test

    publish:
      needs: test
      if: github.event_name == 'push'
      runs-on: ubuntu-latest
      permissions:
        contents: write
        id-token: write # lets npm publish via trusted publishing (OIDC) when configured on npmjs.com
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            registry-url: 'https://registry.npmjs.org'

        # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10.
        - name: Update npm
          run: npm install -g npm@^11.5.1

        - name: Check the version
          id: check
          run: |
            CURRENT_VERSION=$(jq -r .version package.json)
            echo "Current version: $CURRENT_VERSION"
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"

            LATEST_VERSION=${LATEST_TAG#v}

            if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ];
            then
              echo "Version changed"
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            else
              echo "Version not changed"
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi

        - name: Publish
          if: steps.check.outputs.version_changed == 'true'
          run: npm publish --access public
          env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

        # Creates the vX.Y.Z tag and a GitHub Release together, only after npm publish succeeds.
        # Notes come from this version's section of CHANGELOG.md, or are generated from PRs if it has none.
        - name: Create GitHub release
          if: steps.check.outputs.version_changed == 'true'
          env:
            GH_TOKEN: ${{ github.token }}
            VERSION: ${{ steps.check.outputs.new_version }}
          run: |
            awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then
              gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
            else
              gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
            fi
